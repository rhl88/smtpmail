<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"
     role="img" aria-labelledby="iconTitle">
  <title id="iconTitle">SMTP邮箱 · 邮件发送与模板管理</title>
  <defs>
    <!-- 底板渐变：亮蓝 → 靛蓝 → 紫，与同系列应用图标保持统一视觉语言 -->
    <linearGradient id="smBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E86FF"/>
      <stop offset="0.52" stop-color="#5B6BFF"/>
      <stop offset="1" stop-color="#8A4BEF"/>
    </linearGradient>
    <!-- 左上角柔光，提升通透感 -->
    <radialGradient id="smGlow" cx="0.28" cy="0.2" r="0.82">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 右下角暗部，增加底板纵深 -->
    <radialGradient id="smShade" cx="0.85" cy="0.9" r="0.78">
      <stop offset="0" stop-color="#241276" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#241276" stop-opacity="0"/>
    </radialGradient>
    <!-- 信封纸面：纯白到淡蓝，带细腻光泽 -->
    <linearGradient id="smPaper" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EDFF"/>
    </linearGradient>
    <!-- 翻盖：淡蓝紫，与纸面拉开层次 -->
    <linearGradient id="smFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFDBFF"/>
      <stop offset="1" stop-color="#A7BBF6"/>
    </linearGradient>
    <!-- 纸飞机：亮白到冰蓝 -->
    <linearGradient id="smPlane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C8DBFF"/>
    </linearGradient>
    <!-- 主体投影 -->
    <filter id="smShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1A2470" flood-opacity="0.32"/>
    </filter>
    <!-- 底板裁切：约束装饰纹理不越出圆角 -->
    <clipPath id="smBoardClip">
      <rect width="120" height="120" rx="27"/>
    </clipPath>
    <!-- 信封内缘裁切：保证折线与高光不出边界 -->
    <clipPath id="smEnvelopeClip">
      <rect x="16" y="48" width="80" height="44" rx="10"/>
    </clipPath>
  </defs>

  <!-- 圆角底板与光影 -->
  <rect width="120" height="120" rx="27" fill="url(#smBg)"/>
  <rect width="120" height="120" rx="27" fill="url(#smGlow)"/>
  <rect width="120" height="120" rx="27" fill="url(#smShade)"/>
  <g clip-path="url(#smBoardClip)" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2">
    <circle cx="108" cy="106" r="30"/>
    <circle cx="108" cy="106" r="44"/>
  </g>
  <rect x="0.75" y="0.75" width="118.5" height="118.5" rx="26.25"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- 投递轨迹：由信封向右上飞出 -->
  <path d="M64 44 Q68 34 76 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.45"
        stroke-width="2.6" stroke-linecap="round" stroke-dasharray="1 7"/>

  <!-- 信封 -->
  <g filter="url(#smShadow)">
    <rect x="16" y="48" width="80" height="44" rx="10" fill="url(#smPaper)"/>
    <g clip-path="url(#smEnvelopeClip)">
      <path d="M16 48 L56 76 L96 48 Z" fill="url(#smFlap)"/>
      <path d="M16 48 L56 76 L96 48" fill="none" stroke="#4C5CC0" stroke-opacity="0.18"
            stroke-width="5" stroke-linejoin="round"/>
      <path d="M16 48 L56 76 L96 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.9"
            stroke-width="2.4" stroke-linejoin="round"/>
    </g>
    <rect x="16.75" y="48.75" width="78.5" height="42.5" rx="9.25"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="1.5"/>
  </g>

  <!-- 纸飞机：强调 SMTP 投递 -->
  <g filter="url(#smShadow)">
    <path d="M101 15 L92 42 L86.5 30 L74.5 25 Z" fill="url(#smPlane)"/>
    <path d="M101 15 L86.5 30" fill="none" stroke="#7C8CE8" stroke-opacity="0.55"
          stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 星芒亮点，提亮画面 -->
  <g fill="#FFE6A6">
    <path d="M106 60 Q107 65 112 66 Q107 67 106 72 Q105 67 100 66 Q105 65 106 60 Z" fill-opacity="0.9"/>
    <path d="M20 22 Q20.8 26 25 26.8 Q20.8 27.6 20 31.6 Q19.2 27.6 15 26.8 Q19.2 26 20 22 Z" fill-opacity="0.72"/>
  </g>
</svg>
